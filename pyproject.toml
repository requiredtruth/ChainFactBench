[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chainfactbench"
version = "0.1.1"
description = "Block-pinned evaluation of structured AI answers against deterministic EVM facts"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "RequiredTruth"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]

[project.scripts]
chainfactbench = "chainfactbench.cli:main"

[tool.setuptools]
packages = ["chainfactbench"]

[tool.setuptools.package-data]
chainfactbench = ["data/*.json", "data/*.jsonl"]
